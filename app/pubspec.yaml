name: openreview
description: "Free, unlimited chess game reviews with Stockfish on your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  chess_core:
    path: ../packages/chess_core
  review_core:
    path: ../packages/review_core
  stockfish_ffi:
    path: ../packages/stockfish_ffi
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/cburnett/
    - assets/pieces/merida/
    - assets/pieces/chessnut/
    - assets/pieces/LICENSES-lila-COPYING.md
    - assets/openings/
    - assets/engine/
